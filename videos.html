<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DroneSynth — Videos</title>
<meta name="description" content="See DroneSynth played live alongside real instruments and vocals.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <header class="hero">
        <span class="badge">DroneSynth for iOS</span>
        <h1>Videos</h1>
        <p class="tagline">DroneSynth played live, layered under guitar, vocals, and other instruments.</p>
    </header>

    <section class="video-grid">
        <!--
            Each entry is a 16:9 embed. To add a video:
            1. Upload it to YouTube or Vimeo.
            2. Copy this <figure> block.
            3. For YouTube, set the iframe src to:
                 https://www.youtube.com/embed/VIDEO_ID
               For Vimeo:
                 https://player.vimeo.com/video/VIDEO_ID
            4. Update the <figcaption> with a short description.
        -->
        <figure class="video">
            <p class="video-disclaimer">⚠️ This video is from an earlier Android version of DroneSynth, not the current iOS app. New videos of the iOS app are coming soon.</p>
            <div class="video-frame">
                <iframe
                    src="https://www.youtube.com/embed/tvSLvNxVxMw"
                    title="DroneSynth demo video (Android, legacy)"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </div>
            <figcaption>An older Android version of DroneSynth. Live guitar and vocal demos of the new iOS app are coming soon.</figcaption>
        </figure>
    </section>

    <footer>
        <a href="index.html">← Back to DroneSynth</a>
    </footer>
</main>
</body>
</html>
