<!DOCTYPE html>
<html lang="en">
<head>

<title>DroneSynth — Videos</title>
<meta name="description" content="See DroneSynth played live alongside real instruments and vocals.">
<link rel="stylesheet" href="style.css">

<body>
<main>
    <header class="hero">
        <span class="badge">DroneSynth for iOS</span>
        <h1>Videos</h1>

    </header>

    <section>
        <h2>Featured</h2>
        <figure class="video-wide">
            <div class="video-frame">
                <iframe
                    src="https://www.youtube.com/embed/tegejGxTz2M"
                    title="I Tuned My Drone Synth to 448.5 Hz… Then Played It With Our Live Recording"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </div>

        </figure>

            Each entry is a 9:16 embed (YouTube Shorts). To add a video:
            1. Upload it to YouTube or Vimeo.
            2. Copy this <figure> block.
            3. For YouTube, set the iframe src to:
                 https://www.youtube.com/embed/VIDEO_ID
               For Vimeo:
                 https://player.vimeo.com/video/VIDEO_ID
            4. Update the <figcaption> with a short title.
        -->
        <figure class="video">
